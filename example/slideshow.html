<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banner Iklan Slideshow</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f5f5f5;
      }

      .banner-container {
        width: 100%;
        height: 600px; /* Menjaga tinggi tetap */
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        border-radius: 8px;
      }

      .banner-slides {
        display: flex;
        height: 100%;
        transition: transform 0.5s ease;
      }

      .banner-slide {
        flex: 0 0 100%; /* Pastikan setiap slide 100% dari container */
        height: 100%;
      }

      .banner-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Gambar mengisi seluruh ruang */
        display: block;
      }

      .banner-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 10px;
      }

      .banner-nav button {
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        width: 40px;
        height: 60px;
        font-size: 20px;
        cursor: pointer;
        border-radius: 4px;
        transition: background-color 0.3s;
      }

      .banner-nav button:hover {
        background-color: rgba(0, 0, 0, 0.8);
      }

      .banner-indicators {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }

      .banner-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .banner-indicator.active {
        background-color: white;
      }

      /* Responsif untuk layar kecil */
      @media (max-width: 768px) {
        .banner-container {
          height: 400px; /* Sesuaikan tinggi untuk layar kecil */
        }

        .banner-nav button {
          width: 30px;
          height: 50px;
          font-size: 16px;
        }

        .banner-indicators {
          bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="banner-container">
      <div class="banner-slides">
        <div class="banner-slide">
          <img
            src="https://www.hondaibrm.co.id/assets/slider/72a3952588207e9c8fe5dac7d5c338e1.webp"
          />
        </div>
        <div class="banner-slide">
          <img
            src="https://www.hondaibrm.co.id/assets/slider/db4199b624c93e6bd687b0676892eb18.webp"
          />
        </div>
      </div>

      <div class="banner-nav">
        <button class="banner-prev">❮</button>
        <button class="banner-next">❯</button>
      </div>

      <div class="banner-indicators">
        <div class="banner-indicator active" data-slide="0"></div>
        <div class="banner-indicator" data-slide="1"></div>
        <div class="banner-indicator" data-slide="2"></div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const slides = document.querySelector(".banner-slides");
        const slideItems = document.querySelectorAll(".banner-slide");
        const prevBtn = document.querySelector(".banner-prev");
        const nextBtn = document.querySelector(".banner-next");
        const indicators = document.querySelectorAll(".banner-indicator");

        let currentSlide = 0;
        const totalSlides = slideItems.length;
        let slideInterval;

        // Fungsi untuk menggeser slide
        function goToSlide(index) {
          if (index < 0) {
            index = totalSlides - 1;
          } else if (index >= totalSlides) {
            index = 0;
          }

          slides.style.transform = `translateX(-${index * 100}%)`;
          currentSlide = index;

          // Update indikator
          indicators.forEach((indicator, i) => {
            if (i === currentSlide) {
              indicator.classList.add("active");
            } else {
              indicator.classList.remove("active");
            }
          });
        }

        // Fungsi untuk slide berikutnya
        function nextSlide() {
          goToSlide(currentSlide + 1);
        }

        // Fungsi untuk slide sebelumnya
        function prevSlide() {
          goToSlide(currentSlide - 1);
        }

        // Mulai slideshow otomatis
        function startSlideShow() {
          slideInterval = setInterval(nextSlide, 3000);
        }

        // Berhenti slideshow otomatis
        function stopSlideShow() {
          clearInterval(slideInterval);
        }

        // Event listeners
        nextBtn.addEventListener("click", function () {
          nextSlide();
          stopSlideShow();
          startSlideShow();
        });

        prevBtn.addEventListener("click", function () {
          prevSlide();
          stopSlideShow();
          startSlideShow();
        });

        indicators.forEach((indicator) => {
          indicator.addEventListener("click", function () {
            const slideIndex = parseInt(this.getAttribute("data-slide"));
            goToSlide(slideIndex);
            stopSlideShow();
            startSlideShow();
          });
        });

        // Hentikan slideshow saat hover
        document
          .querySelector(".banner-container")
          .addEventListener("mouseenter", stopSlideShow);
        document
          .querySelector(".banner-container")
          .addEventListener("mouseleave", startSlideShow);

        // Mulai slideshow saat halaman dimuat
        startSlideShow();
      });
    </script>
  </body>
</html>
