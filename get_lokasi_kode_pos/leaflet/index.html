<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cek Lokasi</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 300px; }
  </style>
</head>
<body>

<h2>Deteksi Lokasi</h2>
<p>Latitude / Longitude: <span id="coords"></span></p>
<p>Kecamatan: <span id="kecamatan"></span></p>
<p>Kode Pos: <span id="kodepos"></span></p>

<div id="map"></div>
<br>
<button onclick="getLocation()">Isi Otomatis</button>

<script>
function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(success, error);
  } else {
    alert("Geolocation tidak didukung browser.");
  }
}

function success(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  document.getElementById("coords").textContent = `${lat}, ${lon}`;

  // Tampilkan peta
  const map = L.map("map").setView([lat, lon], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  L.marker([lat, lon]).addTo(map);

  // Kirim ke PHP untuk reverse geocoding
  fetch(`reverse.php?lat=${lat}&lon=${lon}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById("kecamatan").textContent = data.kecamatan || "-";
      document.getElementById("kodepos").textContent = data.kodepos || "-";
    })
    .catch(err => console.error("Gagal mengambil data:", err));
}

function error() {
  alert("Gagal mengambil lokasi.");
}
</script>
</body>
</html>
