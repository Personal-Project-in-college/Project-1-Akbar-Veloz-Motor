<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deteksi Lokasi dengan Nominatim & Google Maps</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      #map {
        width: 100%;
        height: 300px;
        margin-top: 10px;
        border: none;
      }
      p {
        margin: 4px 0;
      }
      span {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>Deteksi Lokasi</h2>
    <p>Latitude / Longitude: <span id="coords">-</span></p>
    <p>Jalan: <span id="jalan">-</span></p>
    <p>Desa/Kelurahan: <span id="desa">-</span></p>
    <p>Kecamatan: <span id="kecamatan">-</span></p>
    <p>Kabupaten/Kota: <span id="kabupaten">-</span></p>
    <p>Provinsi: <span id="provinsi">-</span></p>
    <p>Kode Pos: <span id="kodepos">-</span></p>

    <!-- iframe Google Maps -->
    <iframe id="map" loading="lazy" allowfullscreen></iframe>

    <br />
    <button onclick="getLocation()">Deteksi Lokasi Saya</button>

    <script>
      function getLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(success, error);
        } else {
          alert("Geolocation tidak didukung browser.");
        }
      }

      function success(position) {
        // const lat = position.coords.latitude;
        // const lon = position.coords.longitude;

        const lat = -6.509132513046223;
        const lon = 107.80177892483445;

        // Tampilkan koordinat
        document.getElementById("coords").textContent = `${lat}, ${lon}`;

        // Tampilkan iframe Google Maps
        const mapIframe = document.getElementById("map");
        mapIframe.src = `https://www.google.com/maps?q=${lat},${lon}&z=16&output=embed`;

        // Ambil data lokasi dari Nominatim (reverse geocoding)
        fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&addressdetails=1`,
          {
            headers: {
              "User-Agent": "MyLocationApp/1.0",
            },
          }
        )
          .then((res) => res.json())
          .then((data) => {
            console.log("Data lokasi:", data);
            const address = data.address || {};

            // Ambil data alamat dengan fallback
            const jalan = address.road || address.pedestrian || "-";
            const desa =
              address.village || address.suburb || address.hamlet || "-";
            const kecamatan =
              address.city_district || address.town || address.city || "-";
            const kabupatenKota =
              (address.city && !address.county
                ? `Kota ${address.city}`
                : address.county) ||
              address.state_district ||
              "-";
            const provinsi = address.state || "-";
            const kodepos = address.postcode || "Tidak ditemukan";

            // Tampilkan ke HTML
            document.getElementById("jalan").textContent = jalan;
            document.getElementById("desa").textContent = desa;
            document.getElementById("kecamatan").textContent = kecamatan;
            document.getElementById("kabupaten").textContent = kabupatenKota;
            document.getElementById("provinsi").textContent = provinsi;
            document.getElementById("kodepos").textContent = kodepos;
          })
          .catch((err) => {
            console.error("Gagal mengambil data:", err);
            alert("Gagal mengambil data lokasi.");
          });
      }

      function error() {
        alert("Gagal mendapatkan lokasi.");
      }
    </script>
  </body>
</html>
