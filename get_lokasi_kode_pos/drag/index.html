<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deteksi Lokasi dengan Marker Geser</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #map { height: 300px; margin-top: 10px; }
    p { margin: 4px 0; }
    span { font-weight: bold; }
  </style>
</head>
<body>

<h2>Deteksi Lokasi</h2>
<p>Latitude / Longitude: <span id="coords">-</span></p>
<p>Jalan: <span id="jalan">-</span></p>
<p>Desa/Kelurahan: <span id="desa">-</span></p>
<p>Kecamatan: <span id="kecamatan">-</span></p>
<p>Kabupaten/Kota: <span id="kabupaten">-</span></p>
<p>Provinsi: <span id="provinsi">-</span></p>
<p>Kode Pos: <span id="kodepos">-</span></p>

<div id="map"></div>
<br />
<button onclick="getLocation()">Deteksi Lokasi Saya</button>

<script>
let map, marker;

function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(success, error);
  } else {
    alert("Geolocation tidak didukung browser.");
  }
}

function success(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  initMap(lat, lon);
  updateAddress(lat, lon);
}

function initMap(lat, lon) {
  if (!map) {
    map = L.map("map").setView([lat, lon], 16);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    marker = L.marker([lat, lon], { draggable: true }).addTo(map);

    marker.on("dragend", function (e) {
      const pos = marker.getLatLng();
      document.getElementById("coords").textContent = `${pos.lat}, ${pos.lng}`;
      updateAddress(pos.lat, pos.lng);
    });
  } else {
    map.setView([lat, lon], 16);
    marker.setLatLng([lat, lon]);
  }

  document.getElementById("coords").textContent = `${lat}, ${lon}`;
}

function updateAddress(lat, lon) {
  fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&addressdetails=1`, {
    headers: {
      "User-Agent": "MyLocationApp/1.0"
    }
  })
    .then(res => res.json())
    .then(data => {
      const address = data.address || {};

      const jalan = address.road || address.pedestrian || "-";
      const desa = address.village || address.suburb || address.hamlet || "-";
      const kecamatan = address.city_district || address.town || address.city || "-";
      const kabupatenKota =
        (address.city && !address.county ? `Kota ${address.city}` : address.county) ||
        address.state_district || "-";
      const provinsi = address.state || "-";
      const kodepos = address.postcode || "Tidak ditemukan";

      document.getElementById("jalan").textContent = jalan;
      document.getElementById("desa").textContent = desa;
      document.getElementById("kecamatan").textContent = kecamatan;
      document.getElementById("kabupaten").textContent = kabupatenKota;
      document.getElementById("provinsi").textContent = provinsi;
      document.getElementById("kodepos").textContent = kodepos;
    })
    .catch(err => {
      console.error("Gagal mengambil data:", err);
    });
}

function error() {
  alert("Tidak bisa mendapatkan lokasi.");
}
</script>

</body>
</html>
